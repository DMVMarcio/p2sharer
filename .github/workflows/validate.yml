name: Validate and warm build caches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Review repository hygiene
        run: pnpm run check:repository
      - name: Validate version declarations
        run: pnpm run release:check
      - name: Run frontend regressions
        run: pnpm test
      - name: Check frontend compilation
        run: pnpm run build
      - name: Run portable native regressions
        run: pnpm run test:native --release --locked
