name: Validate and warm build caches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Review repository hygiene
        run: pnpm run check:repository
      - name: Validate version declarations
        run: pnpm run release:check
      - name: Run frontend regressions
        run: pnpm test
      - name: Check frontend compilation
        run: pnpm run build
      - name: Run portable native regressions
        run: pnpm run test:native --release --locked

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Review repository hygiene
        run: pnpm run check:repository
      - name: Validate version declarations
        run: pnpm run release:check
      - name: Run frontend regressions
        run: pnpm test
      - name: Check frontend compilation
        run: pnpm run build
      - name: Run portable native regressions
        run: pnpm run test:native --release --locked
      - name: Package macOS test build
        if: github.event_name == 'pull_request'
        run: |
          pnpm run tauri:build -- --locked
          tar -czf src-tauri/target/release/bundle/macos/P2Sharer.app.tar.gz -C src-tauri/target/release/bundle/macos P2Sharer.app
      - name: Upload macOS test application and disk image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: P2Sharer-macos-${{ runner.arch }}-test
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
