name: Deploy web to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Build and restart the web service on the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.SSH_DEPLOY_PATH || '/root/apps/p2sharer/p2sharer' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_SECRET }}
          envs: DEPLOY_PATH
          command_timeout: 20m
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            pnpm install --frozen-lockfile
            pnpm run web:build
            pm2 restart P2Sharer --update-env
