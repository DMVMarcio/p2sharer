name: Deploy web to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Build and restart the web service on the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.SSH_DEPLOY_PATH || '/root/apps/p2sharer/p2sharer' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_SECRET_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: DEPLOY_SHA,DEPLOY_PATH
          command_timeout: 20m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env.production
            command -v node
            command -v pnpm
            command -v pm2
            command -v curl

            git fetch origin main
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
            git checkout --force -B main "$DEPLOY_SHA"

            node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error("Node.js 22.14+ is required")'
            test "pnpm@$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager')"
            pnpm install --frozen-lockfile --prod=false
            pnpm run test:web
            pnpm run web:build

            if pm2 describe P2Sharer >/dev/null 2>&1; then
              pm2 restart P2Sharer --update-env
            else
              pm2 start apps/server/server.mjs --name P2Sharer -- --mode production
            fi

            backend_port=$(node --input-type=module -e 'import { loadWorkspaceEnvironment, deploymentSettings } from "./tools/environment.mjs"; console.log(deploymentSettings(loadWorkspaceEnvironment("production"), "production").backendPort)')
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 "http://127.0.0.1:${backend_port}/api/health"
            pm2 save
