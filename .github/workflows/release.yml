name: Build release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, such as v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Check out build setup from the workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            /.github/actions/setup-build/
            /tools/release.mjs
            /src-tauri/tauri.windows.conf.json
            /src-tauri/windows/installer-hooks.nsh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.release-workflow/.github/actions/setup-build
      - name: Validate public updater key encoding
        run: node .release-workflow/tools/release.mjs normalize-key .
      - name: Apply Windows installer configuration
        shell: pwsh
        run: |
          Copy-Item -LiteralPath '.release-workflow/src-tauri/tauri.windows.conf.json' -Destination 'src-tauri/tauri.windows.conf.json' -Force
          New-Item -ItemType Directory -Path 'src-tauri/windows' -Force | Out-Null
          Copy-Item -LiteralPath '.release-workflow/src-tauri/windows/installer-hooks.nsh' -Destination 'src-tauri/windows/installer-hooks.nsh' -Force
      - name: Validate release version
        shell: pwsh
        run: pnpm run release:check --tag "$env:RELEASE_TAG"
      - name: Protect published releases
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            if (releases.some(release => release.tag_name === process.env.RELEASE_TAG && !release.draft)) {
              throw new Error('Published releases are immutable. Prepare a new version instead.');
            }
      - name: Review repository hygiene
        run: pnpm run check:repository
      - name: Run frontend regressions
        run: pnpm test
      - name: Run portable native regressions
        run: pnpm run test:native --release --locked
      - name: Validate signing setup
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm run release:check --signing
      - name: Build signed installers and draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm run tauri
          args: --config src-tauri/tauri.release.conf.json -- --locked
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: P2Sharer v__VERSION__
          releaseAssetNamePattern: '[name]_[version]_[arch]-setup[ext]'
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
      - name: Verify updater manifest and signing key
        run: node tools/release.mjs artifacts
      - name: Remove obsolete draft MSI asset names
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === process.env.RELEASE_TAG);
            if (!release?.draft) throw new Error('Only draft release assets may be cleaned up.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id, per_page: 100 });
            const stem = `P2Sharer_${process.env.RELEASE_TAG.slice(1)}_x64`;
            for (const name of [`${stem}-setup.msi`, `${stem}-setup.msi.sig`, `${stem}-setup.exe`, `${stem}-setup.exe.sig`, 'latest.json']) {
              if (!assets.some(asset => asset.name === name)) throw new Error(`Missing replacement release asset: ${name}`);
            }
            for (const asset of assets) {
              if ([`${stem}_en-US.msi`, `${stem}_en-US.msi.sig`, `${stem}.msi`, `${stem}.msi.sig`].includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
              }
            }
