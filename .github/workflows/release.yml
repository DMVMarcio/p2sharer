name: Build release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, such as v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Check out build setup from the workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            /.github/actions/setup-build/
            /tools/tauri.mjs
            /tools/installer-names.mjs
            /tools/native-build-env.mjs
            /tools/release.mjs
            /tools/portable-release.mjs
            /tools/test-installer-artifacts.ps1
            /src-tauri/tauri.windows.conf.json
            /src-tauri/windows/installer-hooks.nsh
            /src-tauri/windows/nsis-migration.wxs
            /src-tauri/windows/locales/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.release-workflow/.github/actions/setup-build
      - name: Validate public updater key encoding
        run: node .release-workflow/tools/release.mjs normalize-key .
      - name: Apply Windows installer configuration
        shell: pwsh
        run: |
          foreach ($buildTool in @('tauri.mjs', 'installer-names.mjs', 'native-build-env.mjs', 'release.mjs', 'portable-release.mjs')) {
            Copy-Item -LiteralPath (Join-Path '.release-workflow/tools' $buildTool) -Destination (Join-Path 'tools' $buildTool) -Force
          }
          Copy-Item -LiteralPath '.release-workflow/src-tauri/tauri.windows.conf.json' -Destination 'src-tauri/tauri.windows.conf.json' -Force
          New-Item -ItemType Directory -Path 'src-tauri/windows' -Force | Out-Null
          Copy-Item -LiteralPath '.release-workflow/src-tauri/windows/installer-hooks.nsh' -Destination 'src-tauri/windows/installer-hooks.nsh' -Force
          Copy-Item -LiteralPath '.release-workflow/src-tauri/windows/nsis-migration.wxs' -Destination 'src-tauri/windows/nsis-migration.wxs' -Force
          Copy-Item -LiteralPath '.release-workflow/src-tauri/windows/locales' -Destination 'src-tauri/windows' -Recurse -Force
      - name: Validate release version
        shell: pwsh
        run: pnpm run release:check --tag "$env:RELEASE_TAG"
      - name: Protect published releases
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            if (releases.some(release => release.tag_name === process.env.RELEASE_TAG && !release.draft)) {
              throw new Error('Published releases are immutable. Prepare a new version instead.');
            }
      - name: Review repository hygiene
        run: pnpm run check:repository
      - name: Run frontend regressions
        run: pnpm test
      - name: Check frontend compilation
        run: pnpm run build
      - name: Run portable native regressions
        run: pnpm run test:native --release --locked
      - name: Validate signing setup
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm run release:check --signing
      - name: Build signed installers and draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          P2SHARER_TAURI_ACTION: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm run tauri
          args: --config src-tauri/tauri.release.conf.json -- --locked
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: P2Sharer v__VERSION__
          releaseAssetNamePattern: '[name]_[version]_[arch]-setup[ext]'
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
      - name: Build and sign portable executable
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec node tools/portable-release.mjs --sign
      - name: Upload portable assets and extend updater manifest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const version = process.env.RELEASE_TAG.slice(1);
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === process.env.RELEASE_TAG);
            if (!release?.draft) throw new Error('Only draft releases may receive portable assets.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id, per_page: 100 });
            const latest = assets.find(asset => asset.name === 'latest.json');
            if (!latest) throw new Error('Installer updater manifest is missing.');
            const response = await github.rest.repos.getReleaseAsset({ ...context.repo, asset_id: latest.id, headers: { accept: 'application/octet-stream' } });
            const manifest = JSON.parse(Buffer.from(response.data).toString('utf8'));
            if (manifest.version !== version) throw new Error('Updater manifest version mismatch.');
            const name = `P2Sharer_${version}_x64-portable.exe`;
            let portable;
            for (const assetName of [name, `${name}.sig`]) {
              const previous = assets.find(asset => asset.name === assetName);
              if (previous) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: previous.id });
              const data = fs.readFileSync(`src-tauri/target/release/bundle/portable/${assetName}`);
              const uploaded = await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name: assetName, data });
              if (assetName === name) portable = uploaded.data;
            }
            manifest.platforms['windows-x86_64-portable'] = {
              signature: fs.readFileSync(`src-tauri/target/release/bundle/portable/${name}.sig`, 'utf8').trim(),
              url: portable.url,
            };
            const data = Buffer.from(JSON.stringify(manifest, null, 2) + '\n');
            fs.writeFileSync('latest.json', data);
            await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: latest.id });
            await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name: 'latest.json', data });
      - name: Normalize local MSI filename
        shell: pwsh
        run: |
          $installerVersion = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          pnpm exec node tools/installer-names.mjs "src-tauri/target/release/bundle/msi/P2Sharer_${installerVersion}_x64_en-US.msi"
      - name: Validate compiled MSI upgrade and migration rules
        shell: pwsh
        run: |
          $installerVersion = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          & .release-workflow/tools/test-installer-artifacts.ps1 -MsiPath "src-tauri/target/release/bundle/msi/P2Sharer_${installerVersion}_x64-setup.msi"
      - name: Verify updater manifest and signing key
        run: node tools/release.mjs artifacts
      - name: Remove obsolete draft MSI asset names
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === process.env.RELEASE_TAG);
            if (!release?.draft) throw new Error('Only draft release assets may be cleaned up.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: release.id, per_page: 100 });
            const stem = `P2Sharer_${process.env.RELEASE_TAG.slice(1)}_x64`;
            for (const name of [`${stem}-setup.msi`, `${stem}-setup.msi.sig`, `${stem}-setup.exe`, `${stem}-setup.exe.sig`, `${stem}-portable.exe`, `${stem}-portable.exe.sig`, 'latest.json']) {
              if (!assets.some(asset => asset.name === name)) throw new Error(`Missing replacement release asset: ${name}`);
            }
            for (const asset of assets) {
              const localizedMsi = asset.name.startsWith(`${stem}_`) && /\.msi(?:\.sig)?$/.test(asset.name);
              if (localizedMsi || [`${stem}.msi`, `${stem}.msi.sig`].includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
              }
            }
