name: Feature Request
description: Suggest an improvement or new feature for P2Sharer
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What feature or improvement would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain how this helps people using P2Sharer together.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Optional mockups, comparisons, or design ideas.
